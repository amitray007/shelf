name: shelf

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["node", "dist/operator/cli.js", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  shelf:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SHELF_INSTALLATION_ID: ${SHELF_INSTALLATION_ID:?set SHELF_INSTALLATION_ID}
      SHELF_STORAGE_DRIVER: local
      SHELF_STORAGE_LOCAL_ROOT: /var/lib/shelf/content
      SHELF_HOST: 0.0.0.0
      SHELF_PORT: 3000
      SHELF_AUTH_BASE_URL: ${SHELF_AUTH_BASE_URL:?set SHELF_AUTH_BASE_URL}
      SHELF_AUTH_SECRET_FILE: /run/secrets/shelf_auth_secret
      SHELF_SHARE_SIGNING_KEY_FILE: /run/secrets/shelf_share_signing_key
    secrets:
      - shelf_auth_secret
      - shelf_share_signing_key
    ports:
      - "3000:3000"
    volumes:
      - shelf-content:/var/lib/shelf/content
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

secrets:
  shelf_auth_secret:
    file: ${SHELF_AUTH_SECRET_FILE:-./secrets/auth-secret.txt}
  shelf_share_signing_key:
    file: ${SHELF_SHARE_SIGNING_KEY_FILE:-./secrets/share-signing-key.txt}

volumes:
  postgres-data:
  shelf-content:
