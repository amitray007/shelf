name: Release Please

# Auto-versioning: release-please reads conventional commits that touch the CLI
# package, maintains a release PR that bumps the CLI and root distribution
# versions plus CHANGELOG, and on merge creates the v* tag and GitHub release.
# Merging the release PR is the explicit human authorization for a release.
#
# The publish job calls release.yml directly: the release is created with the
# workflow GITHUB_TOKEN, and GitHub does not fire workflow triggers for events
# that token creates, so the release event alone would never start it.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['apps/cli--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/cli--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
