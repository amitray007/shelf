const brand=`<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 1h10q1 0 1 1v4q0 1-1 1h-9q-4 0-4 4v8q0 1-1 1H2q-1 0-1-1v-9q0-9 9-9Z"/><rect x="13" y="13" width="6" height="6" rx=".7"/><path d="M22 31H12q-1 0-1-1v-4q0-1 1-1h9q4 0 4-4v-8q0-1 1-1h4q1 0 1 1v9q0 9-9 9Z"/></svg>`;
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titles=[['Desktop product brief','MD'],['Viewer layout explorations','HTML'],['Artifact format checklist','MD'],['Shelf brand assets','SVG'],['Link routing notes','MD'],['September roadmap','PDF'],['API reference','JSON'],['First-run flow','HTML'],['Terminal session model','MD'],['Window management','PDF'],['Keyboard map','MD'],['Renderer performance','CSV'],['Persistence notes','MD'],['Command palette study','HTML'],['Release checklist','MD'],['Navigation patterns','PDF'],['WebKit behavior notes','MD'],['Native SDK evaluation','MD'],['Accessibility checklist','MD'],['Useful reading','MD'],['Review from yesterday','PDF'],['A new design direction','HTML'],['Meeting notes','MD'],['Export samples','CSV']];
const layoutNotes={A:'A / Full-width reading. Switch groups above the tab strip; use Find when titles overflow.',B:'B / Scan full titles and collapse groups. Related pages nest under their artifact.',C:'C / Choose a workspace, then a section. The overview replaces a permanent tab list.'};

let groups,tabs,active,group,collapsed,board=true,closed=[],serial=100,modal=null,lastFocus=null,toastTimer;
function seed(n=24){groups=[{id:'shelf',name:'Shelf',color:'#c5bc99',initial:'S'},{id:'helios',name:'Helios',color:'#a7bdcd',initial:'H'},{id:'reading',name:'Reading',color:'#b5a9ce',initial:'R'},{id:'inbox',name:'Inbox',color:'#b1b1b1',initial:'↙'}];tabs=Array.from({length:n},(_,i)=>{let base=titles[i%24];return{id:'t'+i,title:base[0]+(i>=24?' · '+(Math.floor(i/24)+1):''),type:base[1],group:i%24<8?'shelf':i%24<15?'helios':i%24<20?'reading':'inbox',section:i%3,parent:null,url:'https://shelf.example/s/sample-'+i}});active='t0';group='shelf';collapsed=new Set(['helios','reading','inbox']);closed=[];board=true;serial=100;}
seed();
const current=()=>tabs.find(t=>t.id===active);const groupInfo=id=>groups.find(g=>g.id===id)||groups[0];const groupTabs=id=>tabs.filter(t=>t.group===id);const icon=t=>t.type==='WEB'?`<span class="file-icon web">${I('globe')}</span>`:`<span class="file-icon">${escapeHTML(t.type)}</span>`;

function titlebar(){return`<div class="titlebar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><div class="brand">${brand}shelf</div><div class="title-center">Your open work</div><div class="title-actions"><button class="control find" data-action="find">${I('search')}<span>Find a link</span><kbd>⌘ K</kbd></button><button class="control primary" data-action="open">${I('plus')} Open link</button></div></div>`;}

function horizontal(){return`<div class="tabs" role="tablist" aria-label="Open links in ${escapeHTML(groupInfo(group).name)}">${groupTabs(group).map(t=>`<div class="tab ${t.id===active?'active':''}" style="--group:${groupInfo(group).color}"><button class="tab-open" role="tab" aria-selected="${t.id===active}" data-tab="${t.id}" title="${escapeHTML(t.title)}">${icon(t)}<span>${t.parent?'↳ ':''}${escapeHTML(t.title)}</span></button><button class="close" data-close="${t.id}" aria-label="Close ${escapeHTML(t.title)}">×</button></div>`).join('')}<button class="icon-btn" data-action="open" aria-label="Open another link">${I('plus')}</button></div>`;}

function sidebar(){return`<aside class="sidebar" aria-label="Grouped links"><div class="side-top"><h2>Open links <span class="quiet num">${tabs.length}</span></h2><button class="icon-btn" data-action="newgroup" title="New group" aria-label="New group">${I('plus')}</button></div><div class="side-list">${groups.map(g=>`<section><div class="group-heading"><button class="group-toggle" data-collapse="${g.id}" aria-expanded="${!collapsed.has(g.id)}"><span>${collapsed.has(g.id)?'›':'⌄'}</span><i class="dot" style="--group:${g.color}"></i>${escapeHTML(g.name)}<span class="count">${groupTabs(g.id).length}</span></button><button class="icon-btn" data-detach="${g.id}" title="Open ${escapeHTML(g.name)} in a separate window" aria-label="Window preview for ${escapeHTML(g.name)}">${I('external')}</button></div>${collapsed.has(g.id)?'':groupTabs(g.id).filter(t=>!t.parent).map(t=>sideItem(t)+tabs.filter(c=>c.parent===t.id).map(c=>sideItem(c,true)).join('')).join('')||'<div class="quiet" style="padding:8px;font-size:11px">No links in this group.</div>'}</section>`).join('')}</div><div class="sidebar-foot"><span class="save-indicator"><i></i>Current session</span><button data-action="find" title="Find all links" aria-label="Find all links">${I('search')}</button></div></aside>`;}
function toolbar(t){return`<div class="viewer-bar"><div class="viewer-label">${icon(t)}<span>${escapeHTML(t.title)}</span></div>${!t.parent?'<span class="revision">Latest revision</span>':''}<label class="sr-only" for="move-group" style="position:absolute;clip:rect(0,0,0,0)">Move artifact and related pages to group</label><select id="move-group" aria-label="Move artifact and related pages to group">${groups.map(g=>`<option value="${g.id}" ${g.id===t.group?'selected':''}>${escapeHTML(g.name)}</option>`).join('')}</select>${variant==='C'?`<select id="move-section" aria-label="Move artifact to section">${['In progress','Up next','Reference'].map((label,i)=>`<option value="${i}" ${t.section===i?'selected':''}>${label}</option>`).join('')}</select>`:''}<button class="icon-btn detach" data-detach="${t.group}" title="Separate window preview" aria-label="Separate window preview">${I('external')}</button>${variant==='C'?`<button class="icon-btn" data-close="${t.id}" title="Close link" aria-label="Close ${escapeHTML(t.title)}">${I('close')}</button>`:''}</div>`;}
function artifact(t){if(t.parent)return`<article class="paper web-paper"><div class="web-head"><strong>Interface notes</strong><span>patterns.example</span></div><div class="web-article"><span class="web-tag">RELATED READING / SAMPLE WEBSITE</span><h1>Making room for focused work.</h1><p class="lead">A reference opened from your Shelf artifact. It stays with the original document, so you can explore without losing your place.</p><div class="doc-line"></div><h2>Context should survive a click.</h2><p>Keep the source close. Open a reference beside the work it belongs to, and let the reader return in one step.</p><div class="callout">This page is simulated for the mockup. The finished app would load the linked website here.</div><h2>Three small details</h2><p>A readable page title. A visible source. A predictable way back.</p></div></article>`;
let special=t.id==='t0';return`<article class="paper"><div class="doc-meta"><span>${escapeHTML(groupInfo(t.group).name)} / ${t.type==='MD'?'Working document':escapeHTML(t.type)+' artifact'}</span>${brand}</div><h1>${special?'Reading, without<br>losing your place.':escapeHTML(t.title)}</h1><p class="lead">${special?'A small home for the documents, prototypes, and references that make up a project. Open something, follow an idea, and find your way back.':'A sample artifact for this layout study. Use the surrounding controls to compare how each layout handles the same collection of open work.'}</p><div class="doc-author"><span class="avatar">AR</span><span>Amit Ray</span><span>·</span><span>Updated today</span><span>·</span><span>Revision 3</span></div><div class="doc-line"></div><h2>Keep related work together</h2><p>A project can include a brief, a folder of mockups, a spreadsheet, and a few useful references. A group gives those links a place without making every document a separate browser window.</p><div class="callout">The important unit is the work you want to return to. A tab is one way to keep it within reach.</div><h2>Follow a reference</h2><p>What happens when a document leads somewhere else? <button class="reference-link" data-action="related">Open the navigation patterns reference ↗</button> to try a related website inside Shelf.</p><div class="doc-checks"><div class="doc-check"><strong>One artifact, several pages</strong>Keep references attached to their source.</div><div class="doc-check"><strong>Pick up where you stopped</strong>Groups give longer projects a stable home.</div></div></article>`;}
function relatedTray(t){let root=t.parent||t.id;let list=tabs.filter(x=>x.parent===root);if(!list.length)return'';return`<nav class="related-tray" aria-label="Related pages"><span>Related</span>${list.map(x=>`<button data-tab="${x.id}" class="${x.id===active?'active':''}">${I('globe')} ${escapeHTML(x.title)}</button>`).join('')}</nav>`;}
function reader(){let t=current();if(!t)return`<div class="empty"><h2>No open links here</h2><p>Open a Shelf link or choose another group.</p><br>${ctl('open','Open a link','plus')}</div>`;return`${t.parent?`<div class="related-banner"><button data-tab="${t.parent}">← Back to ${escapeHTML(tabs.find(x=>x.id===t.parent)?.title||'artifact')}</button><span>Related website · Stays with its artifact</span></div>`:''}${toolbar(t)}<main class="viewer" aria-label="Artifact preview">${artifact(t)}</main>${relatedTray(t)}`;}
function tile(t,index){let related=tabs.filter(x=>x.parent===t.id).length;return`<button class="tile ${index>1?'tile-row':''}" data-tab="${t.id}" title="Open ${escapeHTML(t.title)}">${index===0?`<div class="thumbnail"><span style="font-size:8px;letter-spacing:1px">${escapeHTML(t.type)} / SHELF ARTIFACT</span><b>${escapeHTML(t.title)}</b><div class="tiny-lines"></div></div>`:''}<div class="tile-label">${icon(t)}<div><strong>${escapeHTML(t.title)}</strong><small>${related?related+' related page'+(related===1?'':'s'):'Updated today · Revision 3'}</small></div><span class="quiet">↗</span></div></button>`;}
function workspace(){let g=groupInfo(group);return`<nav class="spaces" aria-label="Workspaces">${groups.map(x=>`<button class="space-button ${x.id===group?'active':''}" data-space="${x.id}" style="--group:${x.color}" title="${escapeHTML(x.name)}" aria-label="${escapeHTML(x.name)} workspace">${escapeHTML(x.initial)}</button>`).join('')}<button class="icon-btn" data-action="newgroup" aria-label="New workspace">${I('plus')}</button><button class="icon-btn rail-end" data-action="find" aria-label="Find a link">${I('search')}</button></nav><div class="main">${board?`<main class="desk"><div class="desk-title"><div><div class="eyebrow">Workspace</div><h1>${escapeHTML(g.name)}</h1><p>${groupTabs(group).filter(t=>!t.parent).length} artifacts · A place to return to</p></div>${ctl('detach','Separate window','external',`data-group-id="${g.id}"`)}</div><div class="desk-sections">${['In progress','Up next','Reference'].map((s,i)=>`<section><h2 class="section-name"><span><i class="dot" style="--group:${['#c5bc99','#a7bdcd','#b5a9ce'][i]}"></i>${s}</span><span class="count">${groupTabs(group).filter(t=>!t.parent&&t.section===i).length}</span></h2>${groupTabs(group).filter(t=>!t.parent&&t.section===i).map(tile).join('')||'<div class="board-empty">No artifacts in this section.</div>'}</section>`).join('')}</div></main>`:`<div class="desk-focus"><button data-action="overview">${I('grid')} ${escapeHTML(g.name)} workspace</button><span>/</span><span>${['In progress','Up next','Reference'][current()?.section||0]}</span><span class="right">${groupTabs(group).length} links kept in this workspace</span></div>${reader()}`}</div>`;}
function render(){document.querySelector('#app').innerHTML=titlebar()+`<div class="appbody">${variant==='A'?`<div class="main">${groupStrip()}${horizontal()}${reader()}</div>`:variant==='B'?`${sidebar()}<div class="main">${reader()}</div>`:workspace()}</div><div class="statusbar"><span>${tabs.length} open links across ${groups.length} groups</span><span>Sample session · ${variant==='C'?'Spaces keep your collection in reach':'Find any link with ⌘ K'}</span></div>`;document.querySelector('#layout-note').textContent=layoutNotes[variant];document.querySelectorAll('[data-variant]').forEach(b=>{b.classList.toggle('selected',b.dataset.variant===variant);b.setAttribute('aria-pressed',b.dataset.variant===variant)});document.documentElement.dataset.variant=variant;document.querySelector('#state')?.remove();const state=document.createElement('script');state.id='state';state.type='application/json';state.textContent=JSON.stringify({variant,group,active,overview:board,openLinks:tabs.length,groups:groups.map(g=>({name:g.name,links:groupTabs(g.id).length})),closed:closed.length});document.body.append(state);}
function setVariant(v){variant=v;board=true;try{const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState(null,'',u)}catch{}render();}
function openTab(id){let t=tabs.find(t=>t.id===id);if(!t)return;active=id;group=t.group;collapsed.delete(group);board=false;closeModal();render();document.querySelector('.tab.active')?.scrollIntoView({block:'nearest',inline:'nearest'});}
function pickGroup(id){group=id;if(current()?.group!==id)active=groupTabs(id)[0]?.id||null;collapsed.delete(id);render();}
function notice(text,undo=false){clearTimeout(toastTimer);document.querySelector('#notice').innerHTML=`<div class="notice"><span>${escapeHTML(text)}</span>${undo?'<button data-action="undo">Undo</button>':''}</div>`;toastTimer=setTimeout(()=>document.querySelector('#notice').innerHTML='',6500);}
function closeTab(id){let t=tabs.find(t=>t.id===id);if(!t)return;let ids=new Set([id,...tabs.filter(x=>x.parent===id).map(x=>x.id)]);closed.push({items:tabs.map((t,index)=>({t,index})).filter(x=>ids.has(x.t.id)),active,group});tabs=tabs.filter(x=>!ids.has(x.id));if(ids.has(active))active=groupTabs(group)[0]?.id||null;render();notice(ids.size>1?'Closed artifact and '+(ids.size-1)+' related page(s)':'Closed '+t.title,true);}
function undo(){let c=closed.pop();if(!c)return;for(let x of c.items)tabs.splice(Math.min(x.index,tabs.length),0,x.t);active=c.active;group=c.group;render();notice('Link restored');}
function moveGroup(id){let t=current();if(!t)return;let root=t.parent||t.id;for(let x of tabs)if(x.id===root||x.parent===root)x.group=id;group=id;collapsed.delete(id);render();notice('Moved artifact and its related pages to '+groupInfo(id).name);}
function related(){let t=current();if(!t)return;let root=t.parent||t.id;let existing=tabs.find(x=>x.parent===root);if(existing){openTab(existing.id);return;}let child={id:'t'+serial++,title:'Navigation patterns',type:'WEB',group:t.group,section:t.section,parent:root,url:'https://patterns.example/navigation'};tabs.splice(tabs.findIndex(x=>x.id===root)+1,0,child);openTab(child.id);notice('Related page attached to '+tabs.find(x=>x.id===root).title);}
function closeModal(){if(!modal)return;modal=null;document.querySelector('#overlay').innerHTML='';lastFocus?.focus?.();}
function showModal(kind,id){lastFocus=document.activeElement;modal=kind;let body='';if(kind==='find'){body=`<div class="search-head">${I('search')}<input id="search" aria-label="Search all open links" placeholder="Find anything you have open…" autocomplete="off"><button data-action="dismiss" aria-label="Close search">Esc</button></div><div id="results" class="search-results"></div><div class="modal-foot">Search all groups, including related websites. Press Escape to close.</div>`;}else if(kind==='open'){body=`<div class="modal-head">Open a Shelf link<button class="icon-btn" data-action="dismiss" aria-label="Close dialog">${I('close')}</button></div><form id="open-form" class="modal-body"><p>Try a sample link. This mockup adds it to the collection without loading a website.</p><label for="new-title">Title</label><input id="new-title" value="Untitled artifact" required maxlength="100"><label for="new-url">Shelf URL</label><input id="new-url" type="url" value="https://shelf.example/s/new-artifact" required><label for="new-group">Group</label><select id="new-group">${groups.map(g=>`<option value="${g.id}" ${group===g.id?'selected':''}>${escapeHTML(g.name)}</option>`).join('')}</select><div class="modal-actions"><button class="control" type="button" data-action="dismiss">Cancel</button><button class="control primary" type="submit">Open link</button></div></form>`;}else if(kind==='newgroup'){body=`<div class="modal-head">New group<button class="icon-btn" data-action="dismiss" aria-label="Close dialog">${I('close')}</button></div><form id="group-form" class="modal-body"><p>Use a group for a project, a topic, or a set of documents you want to revisit.</p><label for="group-name">Group name</label><input id="group-name" placeholder="e.g. Launch review" required maxlength="32"><div class="modal-actions"><button type="button" class="control" data-action="dismiss">Cancel</button><button class="control primary" type="submit">Create group</button></div></form>`;}else if(kind==='detach'){let g=groupInfo(id||group);body=`<div class="modal-head">Separate window preview<button class="icon-btn" data-action="dismiss" aria-label="Close dialog">${I('close')}</button></div><div class="modal-body"><p>In the native app, this group would move into its own window. This preview shows which links stay together; it does not create an OS window.</p><div class="mini-window"><div class="titlebar"><div class="traffic"><i></i><i></i><i></i></div><span>${escapeHTML(g.name)} · ${groupTabs(g.id).length} links</span></div><div class="mini-content">${groupTabs(g.id).slice(0,5).map(t=>`<div class="result">${icon(t)}<span><strong>${escapeHTML(t.title)}</strong><small>${t.parent?'Related page':'Shelf artifact'}</small></span></div>`).join('')}${groupTabs(g.id).length>5?`<p class="quiet">+ ${groupTabs(g.id).length-5} more links</p>`:''}</div></div><div class="modal-actions">${ctl('dismiss','Back to mockup')}</div></div>`;}else if(kind==='compare'){body=`<div class="modal-head">Three ways to keep links<button class="icon-btn" data-action="dismiss" aria-label="Close dialog">${I('close')}</button></div><div class="modal-body"><p>These layouts use the same session. Changes carry across them. Switch to 80 links to compare a busy day.</p><table class="choice-table"><thead><tr><th>Layout</th><th>Strength</th><th>Cost</th></tr></thead><tbody><tr><td>A · Top tabs</td><td>Familiar switching. Full document width.</td><td>Long titles and many links overflow. Groups hide other work.</td></tr><tr><td>B · Sidebar</td><td>Full titles. Groups and related pages stay visible.</td><td>Uses reading width. Long groups need scrolling.</td></tr><tr><td>C · Workspaces</td><td>Sections help you return to a project. Calm reading view.</td><td>Switching documents needs a trip back to the overview.</td></tr></tbody></table><p style="margin-top:18px">Try: follow the reference inside the brief, move it to a different group, close and undo a link, then find a document in another project.</p></div>`;}
document.querySelector('#overlay').innerHTML=`<div class="modal-bg"><section class="modal" role="dialog" aria-modal="true" aria-label="${escapeHTML(kind==='find'?'Find a link':kind==='compare'?'Compare layouts':kind==='detach'?'Separate window preview':kind==='newgroup'?'New group':'Open a Shelf link')}">${body}</section></div>`;if(kind==='find')results('');document.querySelector('.modal input,.modal button')?.focus();}
function results(query){let q=query.toLowerCase();let items=tabs.filter(t=>(t.title+' '+groupInfo(t.group).name).toLowerCase().includes(q));document.querySelector('#results').innerHTML=items.length?items.map(t=>`<button class="result" data-tab="${t.id}">${icon(t)}<span><strong>${escapeHTML(t.title)}</strong><small>${escapeHTML(groupInfo(t.group).name)}${t.parent?' / Related to '+escapeHTML(tabs.find(x=>x.id===t.parent)?.title||'artifact'):' / '+escapeHTML(t.type)}</small></span>${t.id===active?'<span class="quiet" style="flex:0;font-size:10px">Current</span>':''}</button>`).join(''):'<div class="empty" style="padding:30px">No matching links.</div>';}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b){if(e.target.classList.contains('modal-bg'))closeModal();return;}if(b.dataset.variant){setVariant(b.dataset.variant);return;}if(b.dataset.tab){openTab(b.dataset.tab);return;}if(b.dataset.close){closeTab(b.dataset.close);return;}if(b.dataset.group){pickGroup(b.dataset.group);return;}if(b.dataset.space){group=b.dataset.space;active=groupTabs(group)[0]?.id||null;board=true;render();return;}if(b.dataset.collapse){let id=b.dataset.collapse;collapsed.has(id)?collapsed.delete(id):collapsed.add(id);render();return;}if(b.dataset.detach){showModal('detach',b.dataset.detach);return;}let a=b.dataset.action;if(['open','find','newgroup','compare','detach'].includes(a)){showModal(a,b.dataset.groupId);return;}if(a==='related')related();if(a==='dismiss')closeModal();if(a==='overview'){board=true;render();}if(a==='reset'){seed(+document.querySelector('#density').value);closeModal();render();notice('Sample session reset');}if(a==='undo')undo();if(a==='prev'||a==='next'){let v=['A','B','C'];setVariant(v[(v.indexOf(variant)+(a==='next'?1:2))%3]);}});
document.addEventListener('change',e=>{if(e.target.id==='density'){seed(+e.target.value);render();notice('Loaded '+e.target.value+' sample links');}if(e.target.id==='move-group')moveGroup(e.target.value);if(e.target.id==='move-section'){const t=current();if(t){const root=t.parent||t.id;for(const item of tabs)if(item.id===root||item.parent===root)item.section=+e.target.value;render();notice('Moved to '+['In progress','Up next','Reference'][+e.target.value]);}}});
document.addEventListener('input',e=>{if(e.target.id==='search')results(e.target.value)});
document.addEventListener('submit',e=>{if(e.target.id==='open-form'){e.preventDefault();let title=document.querySelector('#new-title').value.trim();if(!title)return;let t={id:'t'+serial++,title,type:'MD',url:document.querySelector('#new-url').value,group:document.querySelector('#new-group').value,section:0,parent:null};tabs.push(t);openTab(t.id);notice('Added link to '+groupInfo(t.group).name);}if(e.target.id==='group-form'){e.preventDefault();let name=document.querySelector('#group-name').value.trim();if(!name)return;let g={id:'g'+serial++,name,color:'#9fbfae',initial:name.charAt(0).toUpperCase()};groups.push(g);closeModal();group=g.id;active=null;board=true;render();notice('Created '+name);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return;}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showModal('find');return;}if(modal&&e.key==='Tab'){const f=[...document.querySelectorAll('.modal button,.modal input,.modal select')].filter(x=>!x.disabled);if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus();}return;}if(modal||e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();let all=['A','B','C'];setVariant(all[(all.indexOf(variant)+(e.key==='ArrowRight'?1:2))%3]);}});
window.addEventListener('popstate',()=>{let v=new URLSearchParams(location.search).get('variant');if(['A','B','C'].includes(v)){variant=v;render()}});
render();
</script></body></html>
