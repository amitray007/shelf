return`<article class="doc"><div class="eyebrow">${icon('file')} ${esc(sectionFor(x.section)?.name||'Shelf')} / Working document</div><h1>${esc(x.title)}</h1><p class="lead">${x.id==='brief'?'A place for the work you have open. Read it, keep related things together, and close it when you’re done.':'A sample document for trying the sidebar and command menu. Search, move, or close it without leaving the keyboard.'}</p><div class="author"><span class="avatar">AR</span><span>Amit Ray</span><span>·</span><span>Updated today</span></div><h2>New work starts in the Inbox</h2><p>Links opened from another app appear at the top of the Inbox. The latest link opens immediately. Read it now; organize it later. Inbox stays in place, even when empty.</p><div class="workflow"><span>Open a link</span><i>→</i><span>Inbox</span><i>→</i><span>Read, move, or close</span></div><h2>Sections are temporary</h2><p>Use a section for a task or a short run of related work. Drag links between sections. Use the section’s menu to close it when you finish, with Undo if you need it back. Inbox cannot be closed or collapsed.</p><div class="callout">A section keeps things together for as long as you need it. It does not have to become a permanent collection.</div><h2>One place to go next</h2><p>Press <kbd>⌘ K</kbd> to search titles, URLs, or sample document text. Paste a Shelf URL to open it. Type “move”, “close”, or “new section” to organize the current session.</p><h2>Keep references close</h2><p><button class="inline-link" data-action="related">Open the navigation reference ↗</button> to try an external website attached to this artifact.</p></article>`;}
function homeView(){const open=orderedLinks().filter(x=>!x.parent).slice(0,5);const closed=closedStack.slice(-4).reverse();return`<main class="content home-view"><div class="artifact-body"><div class="home-page ${!open.length&&!closed.length?'first-launch':''}"><div class="home-mark">${mark}</div><h1>${open.length?'Pick up where you left off.':closed.length?'All clear.':'Nothing open yet.'}</h1><p class="home-intro">${open.length?'Your open links and recently closed work, in one place.':closed.length?'Open another link, or bring back something you closed.':'Paste a Shelf link with ⌘K. Links opened from other apps land in Inbox.'}</p><button class="home-command" data-action="command"><span>${icon('search')}Find a link or paste a URL</span><kbd>⌘ K</kbd></button>${open.length||closed.length?`<div class="home-lists">${open.length?`<section><h2>Open links</h2>${open.map(x=>`<button class="home-link" data-open="${x.id}">${icon(x.type)}<span><strong>${esc(x.title)}</strong><small>${esc(sectionFor(x.section)?.name||'Inbox')}</small></span>${icon('right')}</button>`).join('')}</section>`:''}${closed.length?`<section><h2>Recently closed</h2>${closed.map((h,i)=>`<button class="home-link" data-reopen="${closedStack.length-1-i}">${icon('undo')}<span><strong>${esc(h.label)}</strong><small>Reopen</small></span>${icon('right')}</button>`).join('')}</section>`:''}</div>`:''}<p class="home-note">${!open.length&&!closed.length?'No setup to get started. Organize links into sections whenever you need.':'Close a link when you’re done. Use ⌘⇧T to bring it back.'}</p></div></div></main>`;}
function previewEmpty(){if(!sampleSession)sampleSession=structuredClone({links,sections,active,undoStack,closedStack});links=[];sections=[{id:'inbox',name:'Inbox',collapsed:false}];active=null;undoStack=[];closedStack=[];dismiss();render();toast('Empty-state preview · Restore sample session from ⌘K')}
function restoreSample(){if(!sampleSession)return;({links,sections,active,undoStack,closedStack}=sampleSession);sampleSession=null;dismiss();render()}
function content(){let x=current();if(!x)return homeView();return`<main class="content"><div class="artifact-nav"><div class="file-crumb">${x.parent?`<button class="back-source" data-open="${x.parent}">${icon('back')} ${esc(links.find(y=>y.id===x.parent)?.title||'Source artifact')}</button>`:`${icon(x.type)}<span><strong>${esc(x.title)}</strong>${x.type==='code'?'.html':x.type==='image'?'.svg':x.type==='table'?'.csv':'.md'}</span>`}</div><div class="artifact-actions">${!x.parent?'<button class="revision" data-action="revision">Latest revision '+icon('down')+'</button>':''}${btn('item-menu','Page actions','more')}</div></div><div class="artifact-body">${documentBody(x)}</div></main>`;}
function render(){document.querySelector('#shell').innerHTML=`<div class="app ${collapsed?'collapsed':''} ${fullscreen?'fullscreen':''}" data-window-state="${windowState}">${windowState==='open'?`<div class="floating-controls">${traffic()}${btn('sidebar','Show sidebar · ⌘\\','panel')}${btn('command','Search links and commands · ⌘K','search')}</div>${sidebar()}${content()}`:`<div class="simulation"><h1>${windowState==='minimized'?'Window minimized':'Window closed'}</h1><p>This is a visual preview of the window state. Your sample links are still here.</p><button data-action="restore">Restore preview</button></div>`}</div>`;document.documentElement.dataset.sidebar=collapsed?'collapsed':'expanded';document.documentElement.dataset.active=active||'';document.documentElement.dataset.view=current()?'artifact':'home';document.documentElement.dataset.links=links.length;}
function saveUndo(label,ids,kind='move',sectionId=null){const h={label,kind,entries:links.map((x,index)=>({link:structuredClone(x),index})).filter(e=>ids.has(e.link.id)),sections:sections.map((x,index)=>({section:structuredClone(x),index})).filter(e=>e.section.id===sectionId||links.some(x=>ids.has(x.id)&&x.section===e.section.id)),active};undoStack.push(h);if(undoStack.length>20)undoStack.shift();if(kind==='close'){closedStack.push(h);if(closedStack.length>20)closedStack.shift()}return h;}
function restoreRecord(h){for(const e of h.sections){if(!sectionFor(e.section.id))sections.splice(Math.min(e.index,sections.length),0,{...e.section,collapsed:false})}if(h.kind==='move'){const ids=new Set(h.entries.map(e=>e.link.id));links=links.filter(x=>!ids.has(x.id))}for(const e of h.entries){if(!links.some(x=>x.id===e.link.id)){links.splice(Math.min(e.index,links.length),0,structuredClone(e.link))}sectionFor(e.link.section).collapsed=false}const reopened=h.entries.find(e=>e.link.id===h.active)||h.entries[0];if(reopened)active=reopened.link.id;dismiss();render();document.querySelector('.tabrow.active')?.scrollIntoView({block:'nearest'});toast('Restored '+h.label);}
function reopenClosed(index=closedStack.length-1){const h=closedStack.splice(index,1)[0];if(!h){toast('No closed links to reopen');return}undoStack=undoStack.filter(x=>x!==h);restoreRecord(h);}
function orderedLinks(){return sections.flatMap(s=>links.filter(x=>x.section===s.id&&!x.parent).flatMap(x=>[x,...links.filter(y=>y.parent===x.id)]))}
function cycleLink(step){const ordered=orderedLinks();if(!ordered.length)return;const i=ordered.findIndex(x=>x.id===active);activate(ordered[i<0?(step>0?0:ordered.length-1):(i+step+ordered.length)%ordered.length].id)}
function toast(text,undo=false){clearTimeout(toastTimer);document.querySelector('#toast').innerHTML=`<div class="toast"><span>${esc(text)}</span>${undo?'<button data-action="undo">Undo</button>':''}<button class="dismiss" data-action="dismiss-toast" aria-label="Dismiss notification">×</button></div>`;toastTimer=setTimeout(()=>document.querySelector('#toast').innerHTML='',7000);}
function undo(){const h=undoStack.pop();if(!h){toast('Nothing to undo');return}closedStack=closedStack.filter(x=>x!==h);restoreRecord(h);}
function activate(id){if(!links.some(x=>x.id===id))return;active=id;current().fresh=false;sectionFor(current().section).collapsed=false;windowState='open';dismiss();render();document.querySelector('.tabrow.active')?.scrollIntoView({block:'nearest'});}
function closeLink(id){let x=links.find(x=>x.id===id);if(!x)return;dismiss();const ids=new Set([id,...links.filter(y=>y.parent===id).map(y=>y.id)]);saveUndo(x.title,ids,'close');const order=orderedLinks(),at=order.findIndex(y=>y.id===id),next=order.slice(at+1).find(y=>!ids.has(y.id))||order.slice(0,at).reverse().find(y=>!ids.has(y.id));links=links.filter(y=>!ids.has(y.id));if(ids.has(active))active=next?.id||null;render();toast('Closed '+x.title,true);}
function closeSection(id){let s=sectionFor(id);if(!s||id==='inbox')return;let removes=new Set(links.filter(x=>x.section===id).map(x=>x.id));saveUndo(s.name,removes,'close',id);links=links.filter(x=>!removes.has(x.id));sections=sections.filter(x=>x.id!==id);if(removes.has(active))active=links[0]?.id||null;render();toast('Closed '+s.name,true);}
function move(id,section,before=null){const x=links.find(x=>x.id===id),s=sectionFor(section);if(!x||!s)return;let root=rootId(id);let moving=links.filter(y=>y.id===root||y.parent===root);if(moving.some(y=>y.id===before))return;saveUndo('move',new Set(moving.map(x=>x.id)));links=links.filter(y=>!moving.includes(y));for(let y of moving)y.section=section;let index=before?links.findIndex(y=>y.id===before):-1;if(index<0)index=links.findLastIndex(y=>y.section===section)+1;if(index<0)index=links.length;links.splice(index,0,...moving);s.collapsed=false;render();toast('Moved to '+s.name,true);}
function addLink(url,title,fromApp=false){let duplicate=links.find(x=>x.url===url);if(duplicate){activate(duplicate.id);toast('Already open');return;}let x={id:'new'+serial++,title:title||titleForURL(url),type:'file',section:'inbox',fresh:fromApp,summary:'Link opened in this sample session',url};links.unshift(x);sectionFor('inbox').collapsed=false;active=x.id;windowState='open';dismiss();render();document.querySelector('.tabrow.active')?.classList.add('active-flash');toast(fromApp?'New link from another app · Inbox':'Opened in Inbox');}
function titleForURL(url){try{const u=new URL(url);let p=u.pathname.split('/').filter(Boolean).at(-1);return p?decodeURIComponent(p).replace(/[-_]/g,' '):u.hostname}catch{return'New Shelf link'}}
function isURL(q){try{let u=new URL(q);return ['http:','https:'].includes(u.protocol)}catch{return false}}
function related(){let x=current();if(!x)return;const root=rootId(x.id);let existing=links.find(y=>y.parent===root);if(existing){activate(existing.id);return;}let child={id:'related'+serial++,title:'Keeping context',type:'globe',section:x.section,parent:root,url:'https://patterns.example/context',summary:'External website reached from '+x.title};let index=links.findIndex(y=>y.id===root);links.splice(index+1,0,child);activate(child.id);}
const actionList=()=>[{label:'Go to Shelf Home',detail:'Open links and recently closed work',icon:'panel',action:()=>{active=null;dismiss();render()}},{label:sampleSession?'Restore sample session':'Preview empty state',detail:sampleSession?'Return to the links from before the preview':'Try Shelf before any links have been opened',icon:'panel',group:'Prototype',action:()=>sampleSession?restoreSample():previewEmpty()},{label:'Open a link…',detail:'Paste a URL in the command menu',key:'⌘ T / ⌘ L',icon:'external',action:()=>{openPalette();input.focus()}},{label:'Next link',key:'⌃ Tab',icon:'right',action:()=>cycleLink(1),disabled:!links.length},{label:'Previous link',key:'⌃ ⇧ Tab',icon:'back',action:()=>cycleLink(-1),disabled:!links.length},{label:'Move current link to…',detail:'Move the artifact and its related pages',key:'⇧ ⌘ M',icon:'move',action:()=>openPalette('move',active),disabled:!current()},{label:'Create a section…',keywords:'new section group',detail:'A temporary home for related links',icon:'plus',action:()=>openPalette('new')},{label:'Close current link',key:'⌘ W',icon:'close',action:()=>closeLink(active),disabled:!current()},{label:'Close a section…',detail:'Close its links together, with Undo',icon:'folder',action:()=>openPalette('close')},{label:'Reopen last closed link',detail:'Restore a closed link or section',key:'⇧ ⌘ T',icon:'undo',action:reopenClosed,disabled:!closedStack.length},{label:collapsed?'Show sidebar':'Hide sidebar',key:'⌘ \\',icon:'panel',action:()=>{collapsed=!collapsed;render()}},{label:fullscreen?'Exit full screen preview':'Enter full screen preview',key:'⌃ ⌘ F',icon:'full',action:()=>{fullscreen=!fullscreen;render();toast(fullscreen?'Full screen preview · Window controls stay visible':'Windowed preview')}},{label:'Preview a link arriving from another app',detail:'Mock a Switchboard handoff into the Inbox',icon:'inbox',group:'Prototype',action:()=>addLink('https://shelf.example/s/review-'+serial,'Review notes · Just received',true)},{label:'Load a busy sample session',detail:'Add 40 sample links to test search and scrolling',icon:'folder',group:'Prototype',action:()=>{for(let i=0;i<40;i++)links.push({id:'busy'+serial++,title:['Research notes','Design review','API reference','Weekly recap'][i%4]+' '+(i+1),type:'file',section:sections[i%sections.length].id,summary:'Searchable sample document for a busy session',url:'https://shelf.example/s/busy-'+serial});render();toast('Added 40 sample links')}}];
function openPalette(next='all',id=null){mode=next;target=id;query='';selected=0;input.value='';if(!palette.open){lastFocus=document.activeElement;palette.showModal();}input.placeholder=mode==='move'?'Move to a section…':mode==='close'?'Choose a section to close…':mode==='new'?'Name your new section…':'Search links or paste a URL…';input.setAttribute('aria-label',input.placeholder);drawPalette();input.focus();}
function dismiss(){if(palette.open)palette.close();document.querySelector('#context').innerHTML='';}
function drawPalette(){let q=query.trim().toLowerCase();choices=[];if(mode==='new'){if(query.trim())choices=[{label:'Create “'+query.trim()+'”',detail:'New section',icon:'plus',group:'Sections',action:()=>{const s={id:'section'+serial++,name:query.trim().slice(0,48),collapsed:false};sections.push(s);render();toast('Created '+s.name)}}];}else if(mode==='move'||mode==='close'){choices=sections.filter(s=>(mode!=='close'||s.id!=='inbox')&&s.name.toLowerCase().includes(q)).map(s=>({label:mode==='close'?'Close '+s.name:s.name,detail:mode==='close'?'Closes '+links.filter(x=>x.section===s.id).length+' links · Undo available':null,icon:s.id==='inbox'?'inbox':'folder',group:'Sections',action:()=>mode==='move'?move(target,s.id):closeSection(s.id)}));}else{if(isURL(query.trim()))choices.push({label:'Open link in Inbox',detail:query.trim(),icon:'external',group:'Open URL',action:()=>addLink(query.trim())});let matches=links.filter(x=>(x.title+' '+x.url+' '+x.summary+' '+sectionFor(x.section)?.name+' '+documentBody(x).replace(/<[^>]*>/g,' ')).toLowerCase().includes(q));let ranked=q?matches:[...matches.filter(x=>x.id===active),...matches.filter(x=>x.fresh&&x.id!==active),...matches.filter(x=>!x.fresh&&x.id!==active)];choices.push(...ranked.slice(0,q?30:5).map(x=>({label:x.title,detail:sectionFor(x.section)?.name+(x.parent?' · Related website':''),icon:x.type,group:q?'Matching links':'Recent links',action:()=>activate(x.id)})));choices.push(...actionList().filter(x=>!x.disabled&&(!q||(x.label+' '+(x.detail||'')+' '+(x.keywords||'')).toLowerCase().includes(q))).map(x=>({...x,group:x.group||'Actions'})));}if(q&&mode==='all'){const rank={ 'Open URL':0,Actions:1,'Matching links':2,Prototype:3 };choices.sort((a,b)=>(rank[a.group]??4)-(rank[b.group]??4))}selected=Math.min(selected,Math.max(0,choices.length-1));let prior='';document.querySelector('#scope').innerHTML=mode==='all'?'':`<div class="palette-scope"><button data-action="palette-back" aria-label="Back to all commands">${icon('back')}</button>${mode==='move'?'Move '+esc(links.find(x=>x.id===target)?.title||'link'):mode==='close'?'Close a section':'Create a section'}</div>`;document.querySelector('#command-list').innerHTML=choices.map((c,i)=>{let head=c.group!==prior?`<div class="command-group" role="presentation">${c.group}</div>`:'';prior=c.group;return head+`<button id="cmd-${i}" class="command-row ${selected===i?'selected':''}" data-command="${i}" role="option" aria-selected="${selected===i}" tabindex="-1">${icon(c.icon)}<span class="command-copy"><strong>${esc(c.label)}</strong>${c.detail?`<small>${esc(c.detail)}</small>`:''}</span><kbd>${c.key||'↵'}</kbd></button>`}).join('')||`<div class="result-empty">${mode==='new'?'Type a section name, then press Enter.':'No matching links or commands.'}</div>`;input.setAttribute('aria-activedescendant',choices.length?'cmd-'+selected:'');}
function runChoice(i){const choice=choices[i];if(!choice)return;const beforeMode=mode;choice.action();if(mode===beforeMode&&choice.label!=='Open a link…')dismiss();}
function selectChoice(i){selected=(i+choices.length)%choices.length;document.querySelectorAll('[data-command]').forEach((el,j)=>{el.classList.toggle('selected',j===selected);el.setAttribute('aria-selected',String(j===selected))});input.setAttribute('aria-activedescendant','cmd-'+selected);document.querySelector('#cmd-'+selected)?.scrollIntoView({block:'nearest'});}
let menuReturn=null;
function itemMenu(id,x,y){menuReturn=document.querySelector('[data-open="'+id+'"]');target=id;const menu=document.querySelector('#context');menu.innerHTML=`<div class="context" role="menu" aria-label="Link actions" style="left:${Math.max(8,Math.min(x,innerWidth-220))}px;top:${Math.max(8,Math.min(y,innerHeight-148))}px"><button role="menuitem" data-action="move-menu">Move to section…<kbd>⇧ ⌘ M</kbd></button><button role="menuitem" data-action="close-menu">Close link<kbd>⌘ W</kbd></button><hr><button role="menuitem" data-action="command">All commands…<kbd>⌘ K</kbd></button></div>`;menu.querySelector('button').focus();}
function sectionMenu(id,x,y){const s=sectionFor(id);if(!s||id==='inbox')return;menuReturn=document.querySelector('[data-collapse="'+id+'"]');const menu=document.querySelector('#context');menu.innerHTML=`<div class="context" role="menu" aria-label="Section actions" style="left:${Math.max(8,Math.min(x,innerWidth-220))}px;top:${Math.max(8,Math.min(y,innerHeight-100))}px"><button role="menuitem" data-collapse="${id}">${s.collapsed?'Expand':'Collapse'} section</button><button role="menuitem" data-close-section="${id}">Close section</button></div>`;menu.querySelector('button').focus();}
document.querySelector('#palette-icon').innerHTML=icon('search');input.addEventListener('input',()=>{query=input.value;selected=0;drawPalette()});palette.addEventListener('click',e=>{if(e.target===palette)dismiss()});palette.addEventListener('close',()=>{const fallback=document.querySelector(collapsed?'.floating-controls [data-action=command]':'.sidebar [data-action=command]');(lastFocus?.isConnected?lastFocus:fallback)?.focus()});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b){if(!e.target.closest('.context'))document.querySelector('#context').innerHTML='';return;}if(b.dataset.reopen!==undefined){reopenClosed(Number(b.dataset.reopen));return;}if(b.dataset.command!==undefined){runChoice(+b.dataset.command);return;}if(b.dataset.open){activate(b.dataset.open);return;}if(b.dataset.close){closeLink(b.dataset.close);return;}if(b.dataset.closeSection){dismiss();closeSection(b.dataset.closeSection);return;}if(b.dataset.collapse){let s=sectionFor(b.dataset.collapse);if(!s||s.id==='inbox')return;dismiss();s.collapsed=!s.collapsed;render();return;}const a=b.dataset.action;if(a==='home'){active=null;dismiss();render()}if(a==='link-menu'){let r=b.getBoundingClientRect();itemMenu(b.dataset.link,r.left,r.bottom+4)}if(a==='section-menu'){let r=b.getBoundingClientRect();sectionMenu(b.dataset.sectionMenu,r.left,r.bottom+4)}if(a==='command'){document.querySelector('#context').innerHTML='';openPalette()}if(a==='dismiss')dismiss();if(a==='palette-back')openPalette();if(a==='sidebar'){collapsed=!collapsed;render()}if(a==='fullscreen'){fullscreen=!fullscreen;render();toast(fullscreen?'Full screen preview · Window controls stay visible':'Windowed preview')}if(a==='close-window'||a==='minimize'){windowState=a==='minimize'?'minimized':'closed';render()}if(a==='restore'){windowState='open';render()}if(a==='related')related();if(a==='undo')undo();if(a==='dismiss-toast')document.querySelector('#toast').innerHTML='';if(a==='revision')toast('Sample artifact · Latest revision 3');if(a==='item-menu'){let r=b.getBoundingClientRect();itemMenu(active,r.right-212,r.bottom+8)}if(a==='move-menu'){let id=target;document.querySelector('#context').innerHTML='';openPalette('move',id)}if(a==='close-menu'){let id=target;dismiss();closeLink(id)}});
document.addEventListener('contextmenu',e=>{const row=e.target.closest('[data-row]');if(row){e.preventDefault();itemMenu(row.dataset.row,e.clientX,e.clientY);return}const section=e.target.closest('[data-drop-section]');if(section&&section.dataset.dropSection!=='inbox'){e.preventDefault();sectionMenu(section.dataset.dropSection,e.clientX,e.clientY)}});
document.addEventListener('dragstart',e=>{const row=e.target.closest('[data-row]');if(!row)return;dragId=row.dataset.row;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';row.classList.add('dragging')});
document.addEventListener('dragover',e=>{const section=e.target.closest('[data-drop-section]');if(!section||!dragId)return;e.preventDefault();e.dataTransfer.dropEffect='move';document.querySelectorAll('.drop-target,.drop-before').forEach(x=>{x.classList.remove('drop-target','drop-before')});section.classList.add('drop-target');e.target.closest('[data-row]')?.classList.add('drop-before')});
document.addEventListener('drop',e=>{const section=e.target.closest('[data-drop-section]');if(!section||!dragId)return;e.preventDefault();let before=e.target.closest('[data-row]')?.dataset.row;move(dragId,section.dataset.dropSection,before);dragId=null});document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.drop-target,.drop-before,.dragging').forEach(x=>{x.classList.remove('drop-target','drop-before','dragging')})});
document.addEventListener('auxclick',e=>{const row=e.target.closest('[data-row]');if(e.button===1&&row){e.preventDefault();closeLink(row.dataset.row)}});
document.addEventListener('keydown',e=>{const cmd=e.metaKey||e.ctrlKey;const k=e.key.toLowerCase();
if(cmd&&!e.altKey&&k==='k'){e.preventDefault();palette.open?dismiss():openPalette();return}
if(cmd&&!e.altKey&&e.shiftKey&&k==='t'){e.preventDefault();dismiss();reopenClosed();return}
if(cmd&&!e.altKey&&!e.shiftKey&&(k==='t'||k==='l')){e.preventDefault();dismiss();openPalette();return}
if(cmd&&!e.altKey&&!e.shiftKey&&k==='w'){e.preventDefault();dismiss();if(active)closeLink(active);return}
if(e.ctrlKey&&!e.metaKey&&k==='tab'){e.preventDefault();cycleLink(e.shiftKey?-1:1);return}
if(e.metaKey&&((e.altKey&&['arrowleft','arrowright'].includes(k))||(e.shiftKey&&['[',']','{','}'].includes(k)))){e.preventDefault();cycleLink(['arrowleft','[','{'].includes(k)?-1:1);return}
