# Single-host deployment profile for Shelf.
#
# Supply configuration through a local .env file or the deployment platform's
# environment editor. Route external traffic through a reverse proxy:
#   Shelf    -> shelf:3000
#   Renderer -> renderer:3001

name: shelf

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["node", "dist/operator/cli.js", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  shelf:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SHELF_INSTALLATION_ID: ${SHELF_INSTALLATION_ID:?set SHELF_INSTALLATION_ID}
      SHELF_STORAGE_DRIVER: local
      SHELF_STORAGE_LOCAL_ROOT: /var/lib/shelf/content
      SHELF_HOST: 0.0.0.0
      SHELF_PORT: 3000
      SHELF_WEB_ROOT: /opt/shelf/web
      SHELF_RENDERER_PUBLIC_ORIGIN: ${SHELF_RENDERER_PUBLIC_ORIGIN:?set SHELF_RENDERER_PUBLIC_ORIGIN}
      SHELF_AUTH_BASE_URL: ${SHELF_AUTH_BASE_URL:?set SHELF_AUTH_BASE_URL}
      SHELF_AUTH_SECRET_FILE: /run/secrets/shelf_auth_secret
      SHELF_SHARE_SIGNING_KEY_FILE: /run/secrets/shelf_share_signing_key
      SHELF_PRIVACY_KEY_FILE: /run/secrets/shelf_privacy_key
    secrets:
      - shelf_auth_secret
      - shelf_share_signing_key
      - shelf_privacy_key
    volumes:
      - shelf-content:/var/lib/shelf/content
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      renderer:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  renderer:
    build: .
    restart: unless-stopped
    command: ["node", "dist/renderer-cli.js"]
    expose:
      - "3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SHELF_INSTALLATION_ID: ${SHELF_INSTALLATION_ID:?set SHELF_INSTALLATION_ID}
      SHELF_STORAGE_DRIVER: local
      SHELF_STORAGE_LOCAL_ROOT: /var/lib/shelf/content
      SHELF_SHARE_SIGNING_KEY_FILE: /run/secrets/shelf_share_signing_key
      SHELF_RENDERER_APP_ORIGIN: ${SHELF_AUTH_BASE_URL:?set SHELF_AUTH_BASE_URL}
      SHELF_RENDERER_HOST: 0.0.0.0
      SHELF_RENDERER_PORT: 3001
    secrets:
      - shelf_share_signing_key
    volumes:
      - shelf-content:/var/lib/shelf/content
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

secrets:
  shelf_auth_secret:
    environment: SHELF_AUTH_SECRET
  shelf_share_signing_key:
    environment: SHELF_SHARE_SIGNING_KEY
  shelf_privacy_key:
    environment: SHELF_PRIVACY_KEY

volumes:
  postgres-data:
  shelf-content:
